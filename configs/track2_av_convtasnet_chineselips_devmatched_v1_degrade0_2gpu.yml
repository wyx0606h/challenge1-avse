# Baseline AV-ConvTasNet fine-tune on Chinese-LiPS dev-domain matched v1.
#
# Purpose: isolate the dataset-domain fix by keeping the official baseline
# concat fusion architecture unchanged.

audionet:
  audionet_name: AV_ConvTasNet
  audionet_config:
    N: 256
    L: 40
    B: 256
    Sc: 256
    H: 512
    P: 3
    X: 8
    E: 512
    V: 256
    K: 3
    D: 5
    F: 256
    R: 4
    skip_con: false
    audio_index: 1
    norm: "gln"
    causal: false

videonet:
  videonet_name: ResNetVideoModel
  videonet_config:
    relu_type: "prelu"
    pretrain: null

loss:
  train:
    loss_func: PITLossWrapper
    sdr_type: pairwise_neg_snr
    config:
      pit_from: pw_mtx
      threshold_byloss: false
  val:
    loss_func: PITLossWrapper
    sdr_type: pairwise_neg_sisdr
    config:
      pit_from: pw_mtx
      threshold_byloss: false

training:
  system: AudioVisualLightningModule
  # Physical GPUs are selected by CUDA_VISIBLE_DEVICES=5,6 in the launch command.
  gpus: [0, 1]
  parallel: ddp
  epochs: 80
  early_stop:
    monitor: val_loss
    mode: min
    patience: 8
    verbose: true

optimizer:
  optim_name: adam
  lr: 0.00001
  weight_decay: 0.0

scheduler:
  sche_name: ReduceLROnPlateau
  sche_config:
    patience: 3
    factor: 0.5

datamodule:
  data_name: Track2DataModule
  data_config:
    train_dir: /home/avse/processed_Chineselips_track2dev_match_v1/tr
    valid_dir: /home/avse/processed_Chineselips_track2dev_match_v1/cv
    test_dir: /home/avse/processed_Chineselips_track2dev_match_v1/tt
    n_src: 1
    sample_rate: 16000
    segment: 2.0
    normalize_audio: false
    face_size: 96
    degrade_prob: 0.0
    batch_size: 4
    num_workers: 4
    pin_memory: true
    persistent_workers: false

exp:
  exp_name: Track2-AVConvTasNet-Baseline-ChineseLipsDevMatchedV1-Degrade0-2GPU
  seed: 20260713

logger:
  enabled: false
  project: Real-Wold-AVSE
  experiment_name: Track2-AVConvTasNet-Baseline-ChineseLipsDevMatchedV1-Degrade0-2GPU
