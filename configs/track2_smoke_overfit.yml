# Fixed-batch Track 2 overfit config for the Chinese lips smoke dataset.
# Artifacts are written outside Git by scripts/overfit_track2_smoke.py.

seed: 20260627
device: auto
output_dir: /home/avse/experiments/baseline_smoke_overfit
steps: 120
log_interval: 10
batch_size: 1
num_workers: 0
fixed_batches: 1
learning_rate: 0.001
grad_clip: 5.0

data:
  train_dir: /home/avse/data_pipeline/outputs/chinese_lips_baseline_smoke/tr
  sample_rate: 16000
  segment: 2.0
  normalize_audio: false
  face_size: 96
  degrade_prob: 0.0

audionet:
  audionet_name: AV_ConvTasNet
  audionet_config:
    N: 256
    L: 40
    B: 256
    Sc: 256
    H: 512
    P: 3
    X: 8
    E: 512
    V: 256
    K: 3
    D: 5
    F: 256
    R: 4
    skip_con: false
    audio_index: 1
    norm: gln
    causal: false

videonet:
  relu_type: prelu
  pretrain: null

loss:
  loss_func: PITLossWrapper
  sdr_type: pairwise_neg_snr
  config:
    pit_from: pw_mtx
    threshold_byloss: false
